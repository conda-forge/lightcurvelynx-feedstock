{% set name = "lightcurvelynx" %}
{% set version = "0.7.2" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/d6/d1/f5a6a0b2bfb403ab617896183682c1af4464e2b33f99609d711dd1a31833/lightcurvelynx-{{ version }}.tar.gz
  sha256: 0407f04d3757fd9fdc680d020165d5fe30eb6039ba50c3372504473adf70e36a

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}.*
    - setuptools >=62
    - setuptools-scm >=6.2
    - pip
  run:
    - python >={{ python_min }}
    - astropy-base
    - astroquery
    - cdshealpix
    - citation-compass >=0.1.0
    - joblib
    - matplotlib-base
    - mocpy
    - nested-pandas >=0.6.0
    - numpy >=2.0
    - pandas
    - pooch
    - pyarrow >19.0.1
    - PyYAML >=6.0
    - regions
    - scipy
    - sncosmo
    - tqdm

test:
  imports:
    - lightcurvelynx
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check

about:
  home: https://github.com/lincc-frameworks/lightcurvelynx
  summary: 'A Fast and Nimble Package for Time Domain Astronomy'
  description: |
    LightCurveLynx aims to provide a flexible, scalable, and user-friendly time-domain
    simulation software with realistic effects and survey strategies. The software
    package consists of multiple stages: a flexible framework for consistently
    sampling model parameters, realistic models of time varying phenomena (such as
    supernovae and AGNs), effect models (such as dust extinction), and survey
    characteristics (such as cadence, filters, and noise).
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jeremykubica
    - hombit
    - mi-dai
    - olivialynn
