{% set name = "lightcurvelynx" %}
{% set version = "0.7.1" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/b3/bc/8d62e787d7aa4982eb1ff337b1242d01a1fa840276ec1e6ffb6da219ce57/lightcurvelynx-{{ version }}.tar.gz
  sha256: 372095e8729f2477fc9d3e9091868485898f8209ecd715554560ac5895550355

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 1

requirements:
  host:
    - python {{ python_min }}.*
    - setuptools >=62
    - setuptools-scm >=6.2
    - pip
  run:
    - python >={{ python_min }}
    - astropy-base
    - astroquery
    - cdshealpix
    - citation-compass >=0.1.0
    - joblib
    - matplotlib-base
    - mocpy
    - nested-pandas >=0.6.0
    - numpy >=2.0
    - pandas
    - pooch
    - pyarrow >19.0.1
    - PyYAML >=6.0
    - regions
    - scipy
    - sncosmo
    - tqdm

test:
  imports:
    - lightcurvelynx
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check

about:
  home: https://github.com/lincc-frameworks/lightcurvelynx
  summary: 'A Fast and Nimble Package for Time Domain Astronomy'
  description: |
    LightCurveLynx aims to provide a flexible, scalable, and user-friendly time-domain
    simulation software with realistic effects and survey strategies. The software
    package consists of multiple stages: a flexible framework for consistently
    sampling model parameters, realistic models of time varying phenomena (such as
    supernovae and AGNs), effect models (such as dust extinction), and survey
    characteristics (such as cadence, filters, and noise).
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jeremykubica
    - hombit
    - mi-dai
    - olivialynn
