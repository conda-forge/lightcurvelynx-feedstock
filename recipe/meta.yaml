{% set name = "lightcurvelynx" %}
{% set version = "0.6.2" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/70/1a/08a22e2f9f0c5adf63290ad55b8d72480e7e6632b2f9b5b2a22283c8507c/lightcurvelynx-{{ version }}.tar.gz
  sha256: 7051f8c555525cb56ecfdbdffe70323110f94193dd3761a252eae1f280fa0f33

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}.*
    - setuptools >=62
    - setuptools-scm >=6.2
    - pip
  run:
    - python >={{ python_min }}
    - astropy-base
    - astroquery
    - cdshealpix
    - citation-compass >=0.0.3
    - matplotlib-base
    - mocpy
    - nested-pandas >=0.6.0
    - networkx
    - numpy >=2.0
    - pandas
    - pooch
    - PyYAML >=6.0
    - regions
    - scipy
    - sncosmo
    - tqdm

test:
  imports:
    - lightcurvelynx
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check

about:
  home: https://github.com/lincc-frameworks/lightcurvelynx
  summary: 'A Fast and Nimble Package for Time Domain Astronomy'
  description: |
    LightCurveLynx aims to provide a flexible, scalable, and user-friendly time-domain
    simulation software with realistic effects and survey strategies. The software
    package consists of multiple stages: a flexible framework for consistently
    sampling model parameters, realistic models of time varying phenomena (such as
    supernovae and AGNs), effect models (such as dust extinction), and survey
    characteristics (such as cadence, filters, and noise).
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jeremykubica
    - hombit
    - mi-dai
    - olivialynn
